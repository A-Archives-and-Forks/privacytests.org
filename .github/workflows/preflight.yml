name: Preflight

on:
  workflow_call:

jobs:
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install curl with HTTP/3
        run: |
          brew install curl
          echo "$(brew --prefix curl)/bin" >> "$GITHUB_PATH"

      - name: Run preflight checks
        run: bash infra/preflight.sh
